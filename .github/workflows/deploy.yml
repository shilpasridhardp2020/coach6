name: Deploy to Azure VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (Optional) If you have a build (npm/yarn/etc), add it here.
      # - name: Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Coach
       uses: easingthemes/ssh-deploy@v5.0.3
        with:
          REMOTE_HOST: 20.244.95.90
          REMOTE_USER: kreat
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: /home/coach6

