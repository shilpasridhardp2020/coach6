name: Deploy static site

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          REMOTE_HOST: 20.244.95.90        # ✅ Hardcoded IP
          REMOTE_USER: kreat               # ✅ Hardcoded SSH user
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}  # 🔒 Still comes from secrets
          TARGET: /var/www/html/coach6     # ✅ Hardcoded deploy path
          SOURCE: .
          ARGS: "-rltgoDzvO --delete"
         
