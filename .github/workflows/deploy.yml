name: Deploy static site to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If you later add a build (vite/webpack), put it above and change SRC_PATH.
      - name: Define paths
        id: paths
        run: |
          echo "SRC_PATH=." >> $GITHUB_OUTPUT
          echo "DEST_PATH=${{ secrets.TARGET_DIR }}" >> $GITHUB_OUTPUT

      - name: Ensure destination exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p ${{ steps.paths.outputs.DEST_PATH }}
            # make sure your user can write there
            sudo chown -R $USER:$USER ${{ steps.paths.outputs.DEST_PATH }}

      - name: Sync files to VM via rsync
        uses: burnett01/rsync-action@v2.2.4
        with:
          switches: -avzr --delete \
            --exclude '.git*' --exclude '.github' --exclude 'node_modules' --exclude '.DS_Store'
          path: ${{ steps.paths.outputs.SRC_PATH }}/
          remote_path: ${{ steps.paths.outputs.DEST_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Post-deploy (permissions + optional Nginx reload)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # readable by web server (www-data) and others
            sudo find ${{ steps.paths.outputs.DEST_PATH }} -type d -exec chmod 755 {} \;
            sudo find ${{ steps.paths.outputs.DEST_PATH }} -type f -exec chmod 644 {} \;
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx && echo "Nginx reloaded."
            else
              echo "Nginx not installed; skipped reload."
            fi
