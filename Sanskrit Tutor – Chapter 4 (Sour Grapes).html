<style>

}
@media (prefers-color-scheme: dark){

    --bg:#17112a; --surface:#221a3a; --surface2:#2d2350; --ink:#f1ecfb; --muted:#b2a7cc; --line:#3b2f60;

  }
}
:root[data-theme="dark"]{
  --bg:#17112a; --surface:#221a3a; --surface2:#2d2350; --ink:#f1ecfb; --muted:#b2a7cc; --line:#3b2f60;
  --grape:#a58bf0; --grape-ink:#17112a; --sun:#f5b73a; --sun-soft:#3a2f12;
  --ok:#6fdca0; --ok-bg:#163a29; --bad:#ff9a92; --bad-bg:#4a1d1a; --end:#ffa36b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--en);font-size:17px;line-height:1.55;min-height:100%}
.sa{font-family:var(--sa);line-height:1.7}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 72px}

/* header */
header.top{padding:22px 0 10px}
header.top h1{margin:0;font-family:var(--sa);font-weight:700;font-size:clamp(26px,5.5vw,40px);line-height:1.35;color:var(--grape)}
header.top p{margin:4px 0 0;color:var(--muted);font-weight:600}
.modebar{display:flex;gap:8px;margin:14px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.modebar button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;font-weight:800}
.modebar button[aria-selected="true"]{background:var(--grape);color:var(--grape-ink);border-color:var(--grape)}
.themebtn{flex:0 0 auto !important;width:46px}

/* lesson nav */
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:#2b1d00}
.steps button.done:not([aria-current="true"]){border-color:var(--ok);color:var(--ok)}

h2.sec{font-family:var(--sa);font-size:28px;margin:22px 0 4px;color:var(--grape)}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.note{background:var(--sun-soft);border-left:6px solid var(--sun);border-radius:8px;padding:12px 16px;margin:14px 0}
.note b{color:var(--ink)}

/* story lines */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--grape);color:var(--grape-ink);border-color:var(--grape)}
.scene{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.scene h3{margin:0;font-size:20px}
.scene span{color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.line .s{font-family:var(--sa);font-size:22px;font-weight:600;line-height:1.6}
.line .e{grid-column:1;color:var(--muted);font-size:16.5px}
.line .say{grid-row:1 / span 2;grid-column:2;align-self:center;border:none;background:var(--surface2);border-radius:50%;width:38px;height:38px}
.line.hl .s{color:var(--end)}
.hide-en .line .e{display:none}
.hide-en .line.peek .e{display:block}
.hide-en .line{cursor:pointer}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;margin:6px 0 10px}
.words span{background:var(--surface2);border-radius:8px;padding:2px 10px;font-size:15.5px}
.words b{font-family:var(--sa);font-weight:600}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{perspective:700px;border:none;background:none;padding:0;height:96px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;padding:6px;border:1px solid var(--line)}
.fc .f{background:var(--surface);font-family:var(--sa);font-size:22px;font-weight:600}
.fc .b{background:var(--grape);color:var(--grape-ink);transform:rotateY(180deg);font-weight:800;font-size:16px}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}

/* tables */
table.vt{border-collapse:collapse;width:100%;min-width:520px;margin:8px 0}
.scroll{overflow-x:auto;max-width:100%}
.vt th,.vt td{border:1px solid var(--line);padding:9px 10px;text-align:center}
.vt th{background:var(--surface2);font-size:14px;font-weight:800}
.vt td{font-family:var(--sa);font-size:21px;font-weight:600;background:var(--surface)}
.vt td small{display:block;font-family:var(--en);font-size:13px;color:var(--muted);font-weight:600}
.vt .end{color:var(--end)}
.vt th.rowh{text-align:left;width:26%}
.roots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.roots .chip{font-family:var(--sa);font-size:19px;padding:2px 14px}
.pattern{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font-family:var(--sa);font-size:24px;font-weight:700;margin:6px 0}
.pattern i{font-style:normal;color:var(--muted);font-size:18px}

.verse{border-left:6px solid var(--grape);padding-left:14px;margin:14px 0}
.verse .l{margin:8px 0 0;font-family:var(--sa);font-size:21px;font-weight:600}
.verse .e{margin:0;color:var(--muted);font-size:16.5px}

.tips li{margin:8px 0}
.tips .sa{font-weight:700;font-size:20px}

.navrow{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.btn{border:2px solid var(--grape);background:var(--grape);color:var(--grape-ink);border-radius:12px;padding:11px 20px;font-weight:800}
.btn.ghost{background:transparent;color:var(--grape)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1d00}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-weight:800;background:var(--surface2);border-radius:999px;padding:4px 14px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.q .qt{font-family:var(--sa);font-size:22px;font-weight:600;margin:0}
.q .qe{color:var(--muted);margin:2px 0 10px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-family:var(--sa);font-size:20px;font-weight:600}
.opt small{display:block;font-family:var(--en);font-size:13.5px;color:var(--muted);font-weight:600}
.opt:hover:not([disabled]){border-color:var(--grape)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb .sa{font-weight:700}
.model{display:none;margin-top:10px}
.model.show{display:block}
.model .a{font-family:var(--sa);font-size:21px;font-weight:700;color:var(--ok)}
.selfmark{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.selfmark.show{display:flex}
select.cell{font-family:var(--sa);font-size:19px;font-weight:600;padding:6px 4px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;width:100%}
select.cell.right{background:var(--ok-bg);border-color:var(--ok)}
select.cell.wrong{background:var(--bad-bg);border-color:var(--bad)}
.result{text-align:center;padding:28px 16px}
.result .big{font-size:56px;font-weight:800;color:var(--grape)}
.stars{font-size:38px;letter-spacing:6px}
.hidden{display:none !important}
</style>
</head>

function say(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=.75;speechSynthesis.speak(u);
  }catch(e){}

};

function mcq(id,qSa,qEn,options,correct,explain){
  // options: array of {v:text, sub?}
  const q=el('div','q');
  q.appendChild(el('p','qt',qSa));
  if(qEn)q.appendChild(el('p','qe',qEn));
  const o=el('div','opts');const fb=el('div','fb');
  let done=false;
  shuffle(options).forEach(op=>{
    const b=el('button','opt',op.v+(op.sub?'<small>'+op.sub+'</small>':''));
    b.onclick=()=>{
      if(done)return;done=true;
      const ok=op.v===correct;
      b.classList.add(ok?'right':'wrong');
      if(!ok)[...o.children].forEach(c=>{if(c.firstChild.textContent===correct)c.classList.add('right')});
      [...o.children].forEach(c=>c.disabled=true);
      if(ok)award(id);
      fb.className='fb show '+(ok?'ok':'no');
      fb.innerHTML=(ok?'✅ <b>Correct!</b> ':'❌ <b>Not quite.</b> The answer is <span class="sa">'+correct+'</span>. ')+(explain||'');
    };
    o.appendChild(b);
  });
  q.appendChild(o);q.appendChild(fb);return q;
}

    const m=el('div','model');m.innerHTML='<div class="a">'+x[2]+'</div><div class="qe">'+x[3]+'</div>';

    const g=el('button','btn','✅ I got it'),n=el('button','btn ghost','🔁 Need practice');
    const res=el('div','fb');
    g.onclick=()=>{award('q3-'+i);res.className='fb show ok';res.textContent='Great — point added!';sm.classList.remove('show');};
    n.onclick=()=>{res.className='fb show no';res.textContent='No problem. Read the story lines again and try once more later.';sm.classList.remove('show');};
    sm.appendChild(g);sm.appendChild(n);
    btn.onclick=()=>{m.classList.add('show');sm.classList.add('show');btn.classList.add('hidden');};
    q.appendChild(btn);q.appendChild(m);q.appendChild(sm);q.appendChild(res);b.appendChild(q);
  });
}
function secQ4(b){
  const items=[["(क)","वन्द्"],["(ख)","पलाय्"],["(ग)","जाय्"]];
  items.forEach((it,k)=>{
    const q=el('div','q');
    q.appendChild(el('p','qt',it[0]+' '+it[1]+' — '+ROOTS[it[1]].m));
    const opts=[];for(let p=0;p<3;p++)for(let n=0;n<3;n++)opts.push(form(it[1],p,n));
    const sc=el('div','scroll');
    let h='<table class="vt"><tr><th></th>'+NUMS.map(n=>'<th>'+n+'</th>').join('')+'</tr>';
    for(let p=0;p<3;p++){h+='<tr><th class="rowh">'+PERSON[p]+'</th>';for(let n=0;n<3;n++)h+='<td data-p="'+p+'" data-n="'+n+'"></td>';h+='</tr>';}
    sc.innerHTML=h+'</table>';
    const cells=[];
    sc.querySelectorAll('td').forEach(td=>{
      const s=el('select','cell');s.setAttribute('aria-label','Person '+(+td.dataset.p+1)+' number '+(+td.dataset.n+1));
      s.appendChild(el('option','','— choose —')).value='';
      shuffle(opts).forEach(o=>{const op=el('option','',o);op.value=o;s.appendChild(op);});
      td.appendChild(s);cells.push([s,+td.dataset.p,+td.dataset.n]);
    });
    q.appendChild(sc);
    const fb=el('div','fb');const chk=el('button','btn','Check');
    let firstDone=false;
    chk.onclick=()=>{
      let good=0;
      cells.forEach(([s,p,n])=>{
        const ok=s.value===form(it[1],p,n);
        s.classList.remove('right','wrong');s.classList.add(ok?'right':'wrong');if(ok)good++;
      });
      if(!firstDone){firstDone=true;award('q4-'+k,0);S.score+=good;S.answered.add('q4-'+k);updateScore();}
      fb.className='fb show '+(good===9?'ok':'no');
      fb.innerHTML=good===9?'✅ <b>All 9 correct!</b>':'You have '+good+' of 9 right. Fix the red boxes and press Check again. Hint: 3rd person ends in <span class="sa">ते / एते / न्ते</span>.';
    };
    q.appendChild(chk);q.appendChild(fb);b.appendChild(q);
  });
}
function secQ5(b){
  Q5.forEach((x,i)=>{
    const [r,f]=x;const [p]=findPN(r,f);
    const opts=[0,1,2].map(pp=>({v:form(r,pp,1)+' , '+form(r,pp,2)}));
    const ans=form(r,p,1)+' , '+form(r,p,2);
    b.appendChild(mcq('q5-'+i,r+' → '+f,'Given: singular. Which are the dual and plural?',opts,ans,
      '<span class="sa">'+f+'</span> is <b>'+PERSON[p]+'</b>, so dual = <span class="sa">'+form(r,p,1)+'</span> and plural = <span class="sa">'+form(r,p,2)+'</span>.'));
  });
}
function secQ6(b){
  b.appendChild(el('div','note','<b>Example:</b> <span class="sa">छात्रः (पलाय्) → छात्रः पलायते।</span> · <span class="sa">चोराः (पलाय्) → चोराः पलायन्ते।</span>'));
  Q6.forEach((x,i)=>{
    const [subj,r,n,en]=x;
    const opts=[0,1,2].map(nn=>({v:form(r,0,nn)}));
    b.appendChild(mcq('q6-'+i,subj+' ('+r+')  →  '+subj+' ____',en,opts,form(r,0,n),
      n===0?'One person → <span class="sa">'+form(r,0,0)+'</span>.':'Many people → <span class="sa">'+form(r,0,2)+'</span>.'));
  });
}
function secQ7(b){
  b.appendChild(el('div','note','<b>Remember:</b> अहम् → <span class="sa">े</span> ending (वन्दे) · त्वम् → <span class="sa">से</span> ending · वयम् → <span class="sa">आमहे</span> ending · सः / one thing → <span class="sa">ते</span> ending.'));
  Q7.forEach((x,i)=>{
    const [q,en,r,ans,opts,why]=x;
    b.appendChild(mcq('q7-'+i,q,en,opts.map(o=>({v:form(r,o[0],o[1])})),form(r,ans[0],ans[1]),why));
  });
}

function renderQuiz(){
  const s=SECTIONS[sec];
  $('#qTitle').textContent=s.t;$('#qInstr').textContent=s.i;
  const b=$('#qBody');b.innerHTML='';
  if(sec===SECTIONS.length){renderResult(b);return;}
  s.r(b);
  updateScore();
  $('#qPrev').disabled=sec===0;
  $('#qNext').textContent= sec===SECTIONS.length-1 ? 'See my result' : 'Next: '+SECTIONS[sec+1].t.split('—')[0].trim();
}
function renderResult(b){
  $('#qTitle').textContent='Result';$('#qInstr').textContent='';
  const pct=Math.round(100*S.score/S.total);
  const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const msg=pct>=90?'Excellent! You know this chapter very well.':pct>=70?'Very good! Revise the verb endings once more and you will be ready.':pct>=40?'Good start. Go back to the Grammar part of the lesson and try again.':'Keep going! Read the story and grammar once more, then retry.';
  const r=el('div','result card');
  r.innerHTML='<div class="stars" aria-label="'+stars+' stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div><div class="big">'+S.score+' / '+S.total+'</div><p>'+msg+'</p>';
  const a=el('button','btn','🔁 Try again');a.onclick=()=>{S.score=0;S.answered=new Set();sec=0;renderQuiz();window.scrollTo({top:0})};
  const c=el('button','btn ghost','📖 Back to the lesson');c.style.marginLeft='8px';c.onclick=()=>showMode('lesson');
  r.appendChild(a);r.appendChild(c);b.appendChild(r);
  $('#qNext').classList.add('hidden');$('#qPrev').disabled=false;
  updateScore();
}
$('#qNext').onclick=()=>{if(sec<SECTIONS.length){sec++;$('#qNext').classList.remove('hidden');renderQuiz();window.scrollTo({top:0});}};
$('#qPrev').onclick=()=>{if(sec>0){sec--;$('#qNext').classList.remove('hidden');renderQuiz();window.scrollTo({top:0});}};

/* ---------- mode switch ---------- */
function showMode(m){
  const q=m==='quiz';
  $('#lesson').classList.toggle('hidden',q);$('#quiz').classList.toggle('hidden',!q);
  $('#tabLesson').setAttribute('aria-selected',!q);$('#tabQuiz').setAttribute('aria-selected',q);
  if(q)renderQuiz();
  window.scrollTo({top:0});
}
$('#tabLesson').onclick=()=>showMode('lesson');
$('#tabQuiz').onclick=()=>showMode('quiz');

renderLesson();
</script>
