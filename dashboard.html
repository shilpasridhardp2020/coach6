<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Dashboard</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3f4f6, #e2e8f0);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(90deg, #007bff, #00b4d8);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .logout {
            position: absolute;
            right: 20px;
            top: 20px;
            background: white;
            color: #007bff;
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .logout:hover {
            background: #0056b3;
            color: white;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 60px;
            justify-items: center;
        }

        .subject-card {
            width: 250px;
            height: 200px;
            border-radius: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .subject-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        .subject-card h2 {
            margin: 0;
            font-size: 1.6rem;
        }

        .subject-card p {
            margin-top: 8px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 180px;
        }

        /* 🎨 Color themes for each subject */
        .physics {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
        }

        .chemistry {
            background: linear-gradient(135deg, #f6d365, #fda085);
        }

        .maths {
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
        }

        .biology {
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header>
        Grade 6 Dashboard
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">
        <div class="subject-card physics" onclick="openSubject('Physics')">
            <h2>Physics</h2>
            <p>Explore motion, force, and energy</p>
        </div>

        <div class="subject-card chemistry" onclick="openSubject('Chemistry')">
            <h2>Chemistry</h2>
            <p>Discover matter and its reactions</p>
        </div>

        <div class="subject-card maths" onclick="openSubject('Maths')">
            <h2>Maths</h2>
            <p>Master numbers, shapes, and logic</p>
        </div>

        <div class="subject-card biology" onclick="openSubject('Biology')">
            <h2>Biology</h2>
            <p>Learn about plants, animals, and life</p>
        </div>
    </div>

    <footer>
        © 2025 Grade 6 Learning Portal
    </footer>

    <script>
        // ✅ Check if user is logged in
        if (!sessionStorage.getItem("loggedIn")) {
            window.location.href = "index.html";
        }

        function openSubject(subject) {
            alert("You clicked on " + subject + "!");
            // You can later redirect:
            // window.location.href = subject.toLowerCase() + ".html";
        }

        function logout() {
            sessionStorage.removeItem("loggedIn");
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
