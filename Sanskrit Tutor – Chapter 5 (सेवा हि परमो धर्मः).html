<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanskrit Tutor – Chapter 5: सेवा हि परमो धर्मः</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f7f4; --surface:#ffffff; --surface2:#e3f0e9; --ink:#1c2b25; --muted:#5b6f66; --line:#cfe0d6;
  --main:#1f6f55; --main-ink:#ffffff; --sun:#f2a516; --sun-soft:#fff2d1;
  --ok:#1f7a4d; --ok-bg:#dff3e7; --bad:#b3261e; --bad-bg:#fbe1de; --end:#c2410c;
  --sa:'Noto Serif Devanagari','Kokila','Mangal','Nirmala UI',serif;
  --en:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101c17; --surface:#182a22; --surface2:#1f3a2f; --ink:#e9f4ee; --muted:#a2bbb0; --line:#2b4a3c;
    --main:#63d1a6; --main-ink:#0e1c16; --sun:#f5b73a; --sun-soft:#3a2f12;
    --ok:#6fdca0; --ok-bg:#163a29; --bad:#ff9a92; --bad-bg:#4a1d1a; --end:#ffa36b;
  }
}
:root[data-theme="dark"]{
  --bg:#101c17; --surface:#182a22; --surface2:#1f3a2f; --ink:#e9f4ee; --muted:#a2bbb0; --line:#2b4a3c;
  --main:#63d1a6; --main-ink:#0e1c16; --sun:#f5b73a; --sun-soft:#3a2f12;
  --ok:#6fdca0; --ok-bg:#163a29; --bad:#ff9a92; --bad-bg:#4a1d1a; --end:#ffa36b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--en);font-size:17px;line-height:1.55;min-height:100%}
.sa{font-family:var(--sa);line-height:1.7}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 72px}
header.top{padding:22px 0 10px}
header.top h1{margin:0;font-family:var(--sa);font-weight:700;font-size:clamp(26px,5.5vw,40px);line-height:1.35;color:var(--main)}
header.top p{margin:4px 0 0;color:var(--muted);font-weight:600}
.modebar{display:flex;gap:8px;margin:14px 0 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.modebar button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;font-weight:800}
.modebar button[aria-selected="true"]{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.themebtn{flex:0 0 auto !important;width:46px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:#2b1d00}
.steps button.done:not([aria-current="true"]){border-color:var(--ok);color:var(--ok)}
h2.sec{font-family:var(--sa);font-size:28px;margin:22px 0 4px;color:var(--main)}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.note{background:var(--sun-soft);border-left:6px solid var(--sun);border-radius:8px;padding:12px 16px;margin:14px 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.scene{margin:28px 0 8px}
.scene h3{margin:0;font-size:21px}
.scene span{color:var(--muted);font-weight:600}
figure.fig{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{padding:8px 14px;color:var(--muted);font-size:15px;border-top:1px solid var(--line)}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.qual{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.qual div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.qual b{display:block;font-size:30px;line-height:1.2}
.qual .sa{font-weight:700;font-size:19px}
.qual small{display:block;color:var(--muted);font-weight:600}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.line .s{font-family:var(--sa);font-size:22px;font-weight:600;line-height:1.6}
.line .e{grid-column:1;color:var(--muted);font-size:16.5px}
.line .say{grid-row:1 / span 2;grid-column:2;align-self:center;border:none;background:var(--surface2);border-radius:50%;width:38px;height:38px}
.line.hl .s{color:var(--end)}
.hide-en .line .e{display:none}
.hide-en .line.peek .e{display:block}
.hide-en .line{cursor:pointer}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;margin:6px 0 10px}
.words span{background:var(--surface2);border-radius:8px;padding:2px 10px;font-size:15.5px}
.words b{font-family:var(--sa);font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fc{perspective:700px;border:none;background:none;padding:0;height:96px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;padding:6px;border:1px solid var(--line)}
.fc .f{background:var(--surface);font-family:var(--sa);font-size:21px;font-weight:600}
.fc .b{background:var(--main);color:var(--main-ink);transform:rotateY(180deg);font-weight:800;font-size:16px}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}
.scroll{overflow-x:auto;max-width:100%}
table.vt{border-collapse:collapse;width:100%;min-width:480px;margin:8px 0}
.vt th,.vt td{border:1px solid var(--line);padding:9px 10px;text-align:center}
.vt th{background:var(--surface2);font-size:14px;font-weight:800}
.vt td{font-family:var(--sa);font-size:20px;font-weight:600;background:var(--surface)}
.vt td small{display:block;font-family:var(--en);font-size:13px;color:var(--muted);font-weight:600}
.vt .end{color:var(--end)}
.vt th.rowh{text-align:left}
.roots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.roots .chip{font-family:var(--sa);font-size:19px;padding:2px 14px}
.pattern{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pattern div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-family:var(--sa);font-size:22px;font-weight:700}
.pattern div small{display:block;font-family:var(--en);font-size:14px;font-weight:700;color:var(--muted)}
.verse{border-left:6px solid var(--main);padding-left:14px;margin:14px 0}
.verse .l{margin:8px 0 0;font-family:var(--sa);font-size:21px;font-weight:600}
.verse .e{margin:0;color:var(--muted);font-size:16.5px}
.tips li{margin:8px 0}
.tips .sa{font-weight:700;font-size:20px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.btn{border:2px solid var(--main);background:var(--main);color:var(--main-ink);border-radius:12px;padding:11px 20px;font-weight:800}
.btn.ghost{background:transparent;color:var(--main)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1d00}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-weight:800;background:var(--surface2);border-radius:999px;padding:4px 14px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.q .qt{font-family:var(--sa);font-size:22px;font-weight:600;margin:0}
.q .qe{color:var(--muted);margin:2px 0 10px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-family:var(--sa);font-size:20px;font-weight:600}
.opt.en{font-family:var(--en);font-size:17px}
.opt:hover:not([disabled]){border-color:var(--main)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb .sa{font-weight:700}
.model{display:none;margin-top:10px}
.model.show{display:block}
.model .a{font-family:var(--sa);font-size:21px;font-weight:700;color:var(--ok)}
.selfmark{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.selfmark.show{display:flex}
.result{text-align:center;padding:28px 16px}
.result .big{font-size:56px;font-weight:800;color:var(--main)}
.stars{font-size:38px;letter-spacing:6px}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>अध्याय 5 — सेवा हि परमो धर्मः</h1>
    <p>Grade 7 Sanskrit · Chapter 5 · “Service is indeed the highest duty”</p>
  </header>
  <div class="modebar" role="tablist" aria-label="Choose mode">
    <button role="tab" id="tabLesson" aria-selected="true">📖 Lesson</button>
    <button role="tab" id="tabQuiz" aria-selected="false">✏️ Questions &amp; Answers</button>
    <button class="themebtn" id="themeBtn" aria-label="Switch light or dark theme" title="Light / dark">🌗</button>
  </div>

  <main id="lesson">
    <nav class="steps" id="steps" aria-label="Lesson parts"></nav>
    <section id="lessonBody"></section>
    <div class="navrow">
      <button class="btn ghost" id="prevBtn">Back</button>
      <button class="btn" id="nextBtn">Next</button>
    </div>
  </main>

  <main id="quiz" class="hidden">
    <div class="qhead">
      <h2 class="sec" id="qTitle" style="margin:6px 0"></h2>
      <span class="score" id="scoreTag">Score 0</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <p class="sub" id="qInstr"></p>
    <div id="qBody"></div>
    <div class="navrow">
      <button class="btn ghost" id="qPrev">Back</button>
      <button class="btn" id="qNext">Next section</button>
    </div>
  </main>
</div>

<script>
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=.75;speechSynthesis.speak(u);}catch(e){}}
$('#themeBtn').onclick=()=>{const r=document.documentElement;const d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');};

/* ================= ILLUSTRATIONS (simple SVG) ================= */
const FF="font-family=\"'Noto Serif Devanagari',serif\"";
function person(x,y,shirt,o={}){
  return `<g transform="translate(${x} ${y})">
    <rect x="-9" y="8" width="7" height="20" rx="3" fill="#3b3b5c"/><rect x="2" y="8" width="7" height="20" rx="3" fill="#3b3b5c"/>
    <rect x="-13" y="-22" width="26" height="34" rx="10" fill="${shirt}"/>
    ${o.coat?'<rect x="-13" y="-22" width="26" height="34" rx="10" fill="#fff" opacity=".9"/><rect x="-2" y="-20" width="4" height="30" fill="#cfd8dc"/>':''}
    <circle cy="-34" r="12" fill="#f0c6a0"/>
    ${o.crown?'<path d="M-11 -44 l4 -11 l7 8 l7 -8 l4 11z" fill="#f2b705"/>':'<path d="M-12 -38 q12 -14 24 0 z" fill="#2a2018"/>'}
    <circle cx="-4" cy="-34" r="1.6" fill="#222"/><circle cx="4" cy="-34" r="1.6" fill="#222"/>
    <path d="M-4 -29 q4 4 8 0" stroke="#7a3b2e" stroke-width="1.6" fill="none"/></g>`;
}
function flask(x,y,color){
  return `<g transform="translate(${x} ${y})"><path d="M-7 -40 h14 v20 l19 26 a6 6 0 0 1 -5 9 h-42 a6 6 0 0 1 -5 -9 l19 -26 z" fill="#e8f7ff" stroke="#456" stroke-width="2"/>
  <path d="M-20 -2 h40 l7 10 a6 6 0 0 1 -5 9 h-44 a6 6 0 0 1 -5 -9z" fill="${color}" opacity=".85"/><circle cx="-5" cy="-6" r="3" fill="#fff" opacity=".8"/><circle cx="6" cy="-12" r="2" fill="#fff" opacity=".8"/></g>`;
}
function bubble(x,y,w,text){
  return `<g><rect x="${x}" y="${y}" width="${w}" height="26" rx="10" fill="#fff" stroke="#9aa" /><text x="${x+w/2}" y="${y+18}" text-anchor="middle" font-size="13" fill="#222" ${FF}>${text}</text></g>`;
}
const FIG={
 lab:`<figure class="fig"><svg viewBox="0 0 320 160" role="img" aria-label="Nagarjuna working in his laboratory">
  <rect width="320" height="160" fill="#e6f2ff"/><rect y="128" width="320" height="32" fill="#c9b79c"/>
  <rect x="150" y="98" width="150" height="10" rx="3" fill="#8a5a33"/><rect x="158" y="108" width="8" height="30" fill="#8a5a33"/><rect x="284" y="108" width="8" height="30" fill="#8a5a33"/>
  ${flask(190,98,'#3fbf7f')}${flask(255,98,'#e0664f')}
  ${person(90,100,'#5a8dee',{coat:1})}
  <text x="20" y="28" font-size="16" fill="#1d4d8f" ${FF}>प्रयोगशाला</text>
  <circle cx="200" cy="40" r="4" fill="#fff"/><circle cx="210" cy="28" r="3" fill="#fff"/></svg>
  <figcaption>Nagarjuna, the chemist-physician, works day and night in his laboratory (प्रयोगशाला).</figcaption></figure>`,
 king:`<figure class="fig"><svg viewBox="0 0 320 160" role="img" aria-label="Nagarjuna speaks to the king">
  <rect width="320" height="160" fill="#fdf1dc"/><rect y="130" width="320" height="30" fill="#b98a5a"/>
  <rect x="40" y="60" width="70" height="72" rx="8" fill="#9c2f3a"/><rect x="34" y="118" width="82" height="14" rx="4" fill="#6f1f28"/>
  ${person(75,100,'#c0392b',{crown:1})}
  ${person(240,102,'#ffffff',{coat:1})}
  ${bubble(150,28,160,'महाराज! सहायकः आवश्यकः')}
  <text x="75" y="24" text-anchor="middle" font-size="15" fill="#8a5a1a" ${FF}>राजा</text></svg>
  <figcaption>Nagarjuna asks the king for an assistant (सहायकः).</figcaption></figure>`,
 first:`<figure class="fig"><svg viewBox="0 0 320 160" role="img" aria-label="The first young man gives the medicine to Nagarjuna">
  <rect width="320" height="160" fill="#eaf4ea"/><rect y="130" width="320" height="30" fill="#c9b79c"/>
  ${person(95,102,'#3d6fd1')}${flask(150,100,'#3fbf7f')}${person(235,102,'#ffffff',{coat:1})}
  ${bubble(30,18,150,'औषधं निर्मितवान्')}
  <text x="95" y="150" text-anchor="middle" font-size="13" fill="#333" ${FF}>प्रथमः युवकः</text></svg>
  <figcaption>The first young man made the medicine and handed it over, even though he left his parents' troubles aside.</figcaption></figure>`,
 road:`<figure class="fig"><svg viewBox="0 0 320 170" role="img" aria-label="Two young men on the highway, one stops to help a sick person">
  <rect width="320" height="170" fill="#dff1ff"/><rect y="118" width="320" height="52" fill="#7c8791"/>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="14 10"><line x1="0" y1="146" x2="320" y2="146"/></g>
  <text x="10" y="20" font-size="15" fill="#1d4d8f" ${FF}>राजमार्गः (highway)</text>
  <g transform="translate(60 130)"><rect x="-26" y="-8" width="52" height="16" rx="8" fill="#e08a3c"/><circle cx="-30" cy="-2" r="10" fill="#f0c6a0"/><text x="-12" y="-16" font-size="20">🤒</text></g>
  ${person(120,100,'#2f9e6b')}
  <text x="120" y="48" text-anchor="middle" font-size="13" fill="#1a6b48" ${FF}>द्वितीयः: स्थितवान्</text>
  ${person(250,100,'#3d6fd1')}
  <text x="250" y="48" text-anchor="middle" font-size="13" fill="#2a4fa0" ${FF}>प्रथमः: अग्रे गतवान्</text>
  <path d="M275 112 l25 0 l-8 -7 m8 7 l-8 7" stroke="#2a4fa0" stroke-width="3" fill="none"/></svg>
  <figcaption>Both were told to take the highway. The first walked past the sick man. The second stopped.</figcaption></figure>`,
 home:`<figure class="fig"><svg viewBox="0 0 320 160" role="img" aria-label="The second young man takes the sick person home and serves him">
  <rect width="320" height="160" fill="#fff3d6"/><rect y="130" width="320" height="30" fill="#a8c98a"/>
  <circle cx="40" cy="34" r="16" fill="#ffd54a"/>
  <rect x="215" y="72" width="80" height="60" fill="#e6b98a"/><path d="M205 76 l50 -38 l50 38z" fill="#b5482f"/><rect x="243" y="98" width="24" height="34" fill="#7a4a2a"/>
  ${person(120,102,'#2f9e6b')}
  <g transform="translate(160 106)"><rect x="-9" y="-22" width="18" height="34" rx="8" fill="#e08a3c"/><circle cy="-34" r="11" fill="#f0c6a0"/><rect x="-7" y="12" width="6" height="16" fill="#3b3b5c"/><rect x="2" y="12" width="6" height="16" fill="#3b3b5c"/></g>
  <text x="140" y="46" font-size="26">❤️</text>
  <text x="230" y="62" font-size="14" fill="#7a2f1a" ${FF}>स्वगृहम्</text></svg>
  <figcaption>He took the sick man to his own home and served him for two days. The man became well.</figcaption></figure>`,
 scale:`<figure class="fig"><svg viewBox="0 0 320 170" role="img" aria-label="A balance: knowledge alone is not enough, service is also needed">
  <rect width="320" height="170" fill="#f1ecff"/>
  <rect x="152" y="40" width="16" height="110" fill="#6a5a8e"/><rect x="110" y="146" width="100" height="10" rx="4" fill="#6a5a8e"/>
  <g transform="rotate(-6 160 40)"><rect x="40" y="36" width="240" height="8" rx="4" fill="#8b78c4"/>
   <line x1="60" y1="44" x2="60" y2="96" stroke="#6a5a8e" stroke-width="2"/><rect x="24" y="96" width="72" height="8" rx="4" fill="#8b78c4"/>
   <text x="60" y="88" text-anchor="middle" font-size="26">📚</text>
   <line x1="260" y1="44" x2="260" y2="104" stroke="#6a5a8e" stroke-width="2"/><rect x="224" y="104" width="72" height="8" rx="4" fill="#8b78c4"/>
   <text x="260" y="98" text-anchor="middle" font-size="26">❤️</text></g>
  <text x="50" y="132" text-anchor="middle" font-size="14" fill="#3b2d6b" ${FF}>ज्ञानम्</text>
  <text x="270" y="140" text-anchor="middle" font-size="14" fill="#3b2d6b" ${FF}>सेवाभावना</text></svg>
  <figcaption>A good doctor needs both: knowledge and a spirit of service.</figcaption></figure>`
};

/* ================= LESSON DATA ================= */
const STORY=[
 {title:"Page 47–48 — What makes a person truly successful?",sub:"A talk between a teacher and her students.",fig:'quals',lines:[
  ["प्रियच्छात्राः! जीवने सफलतां प्राप्तुं किं किम् अपेक्षितम्?","Dear students! What all is required to achieve success in life?"],
  ["विद्याम्!","Education / knowledge!"],["उपाधिम्!","A degree / qualification!"],["पदवीम्!","A position / designation!"],["धनम्!","Money / wealth!"],

function mcq(id,qSa,qEn,options,correct,explain,en){
  const q=el('div','q');q.appendChild(el('p','qt',qSa));if(qEn)q.appendChild(el('p','qe',qEn));
  const o=el('div','opts');const fb=el('div','fb');let done=false;
  shuffle(options).forEach(v=>{
    const b=el('button','opt'+(en?' en':''),v);b.dataset.v=v;
    b.onclick=()=>{
      if(done)return;done=true;const ok=v===correct;b.classList.add(ok?'right':'wrong');
      if(!ok)[...o.children].forEach(c=>{if(c.dataset.v===correct)c.classList.add('right')});
      [...o.children].forEach(c=>c.disabled=true);if(ok)award(id);
      fb.className='fb show '+(ok?'ok':'no');
      fb.innerHTML=(ok?'✅ <b>Correct!</b> ':'❌ <b>Not quite.</b> The answer is <span class="'+(en?'':'sa')+'">'+correct+'</span>. ')+(explain||'');
    };o.appendChild(b);
  });
  q.appendChild(o);q.appendChild(fb);return q;
}

  });
}
function secQ3(b){
  b.appendChild(el('div','note','<b>Example:</b> <span class="sa">पठितवान् → पठितवन्तः</span> (read)'));
  Q3V.forEach((x,i)=>{const k=KT(x[0]);
    b.appendChild(mcq('q3-'+i,k.ms+' → ?',x[1]+' (male, one → male, many)',[k.mp,k.ms.replace('वान्','वती'),k.fp,k.ms],k.mp,
      '<span class="sa">'+k.ms+'</span> → <span class="sa">'+k.mp+'</span>: वान् changes to वन्तः.'));});
}
function secQ4(b){
  b.appendChild(el('div','note','<b>Example:</b> <span class="sa">पठितवती → पठितवत्यः</span> (read)'));
  Q4V.forEach((x,i)=>{const k=KT(x[0]);
    b.appendChild(mcq('q4-'+i,k.fs+' → ?',x[1]+' (female, one → female, many)',[k.fp,k.mp,k.fs,k.ms],k.fp,
      '<span class="sa">'+k.fs+'</span> → <span class="sa">'+k.fp+'</span>: वती changes to वत्यः.'));});
}
function secQ5(b){
  b.appendChild(el('div','note','<b>Example:</b> <span class="sa">पिता कषायं पिबति → पिता कषायं पीतवान्।</span> · <span class="sa">अहं पुस्तकं नयामि → अहं पुस्तकं नीतवान् / नीतवती।</span>'));
  Q5.forEach((x,i)=>{
    const q=mcq('q5-'+i,'('+LET[i]+') '+x[0],x[1]+'  ▸  '+x[2],x[4],x[3],x[5]+' Full answer: <span class="sa">'+x[2].replace('____','<b>'+x[3]+'</b>')+'</span>');
    b.appendChild(q);
  });
}
function secSM(b){QSM.forEach((x,i)=>b.appendChild(mcq('sm-'+i,x[0],x[1],x[2],x[2][x[3]],x[4],/^[A-Za-z]/.test(x[2][0]))));}
function secPic(b){QPIC.forEach((x,i)=>b.appendChild(mcq('pic-'+i,x[0],'',x[1],x[1][x[2]],x[3],true)));}

function renderQuiz(){
  if(sec>=SECTIONS.length){renderResult();return;}
  const s=SECTIONS[sec];$('#qTitle').textContent=s.t;$('#qInstr').textContent=s.i;
  const b=$('#qBody');b.innerHTML='';s.r(b);updateScore();
  $('#qNext').classList.remove('hidden');$('#qPrev').disabled=sec===0;
  $('#qNext').textContent=sec===SECTIONS.length-1?'See my result':'Next: '+SECTIONS[sec+1].t.split('—').pop().trim();
}
function renderResult(){
  $('#qTitle').textContent='Result';$('#qInstr').textContent='';
  const b=$('#qBody');b.innerHTML='';
  const pct=Math.round(100*S.score/S.total);const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const msg=pct>=90?'Excellent! You know this chapter very well.':pct>=70?'Very good! Revise the क्तवतु endings once more and you will be ready.':pct>=40?'Good start. Go back to the Grammar part of the lesson and try again.':'Keep going! Read the story and grammar once more, then retry.';
  const r=el('div','result card');
  r.innerHTML='<div class="stars" aria-label="'+stars+' stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div><div class="big">'+S.score+' / '+S.total+'</div><p>'+msg+'</p>';
  const a=el('button','btn','🔁 Try again');a.onclick=()=>{S.score=0;S.answered=new Set();sec=0;renderQuiz();window.scrollTo({top:0})};
  const c=el('button','btn ghost','📖 Back to the lesson');c.style.marginLeft='8px';c.onclick=()=>showMode('lesson');
  r.appendChild(a);r.appendChild(c);b.appendChild(r);
  $('#qNext').classList.add('hidden');$('#qPrev').disabled=false;updateScore();
}
$('#qNext').onclick=()=>{if(sec<SECTIONS.length){sec++;renderQuiz();window.scrollTo({top:0});}};
$('#qPrev').onclick=()=>{if(sec>0){sec--;renderQuiz();window.scrollTo({top:0});}};

function showMode(m){
  const q=m==='quiz';
  $('#lesson').classList.toggle('hidden',q);$('#quiz').classList.toggle('hidden',!q);
  $('#tabLesson').setAttribute('aria-selected',!q);$('#tabQuiz').setAttribute('aria-selected',q);
  if(q)renderQuiz();window.scrollTo({top:0});
}
$('#tabLesson').onclick=()=>showMode('lesson');
$('#tabQuiz').onclick=()=>showMode('quiz');
renderLesson();
</script>
